name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check code.js
      - run: npm --prefix plugins/ai-poster-assistant/mcp-bridge run check
      - run: npm --prefix plugins/ai-poster-assistant/mcp-bridge test
