name: Setup help
description: Ask for help installing or connecting Layntra.
title: "[Setup]: "
labels: [setup]
body:
  - type: checkboxes
    id: completed
    attributes:
      label: Steps already completed
      options:
        - label: I ran `./scripts/install.sh`.
        - label: I imported `apps/figma-plugin/manifest.json`.
        - label: I ran Layntra for Figma and kept its window open.
        - label: I started a new Codex task and ran `$layntra status`.
  - type: textarea
    id: result
    attributes:
      label: What did `$layntra status` report?
      description: Remove paths, account data, file IDs, and sensitive document text.
    validations:
      required: true
