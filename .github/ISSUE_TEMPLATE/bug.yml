name: Bug report
description: Report reproducible Layntra behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private Figma files, account data, tokens, or unredacted screenshots.
  - type: input
    id: version
    attributes:
      label: Layntra version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the explicit $layntra command, target, and observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS, Node, Codex, and Figma versions; redact account details.
    validations:
      required: true
